<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      body {
        font: 12px/1.4 Inter, system-ui, sans-serif; margin: 0; padding: 16px;
        color: var(--figma-color-text, #1f1f1f); background: var(--figma-color-bg, #fff);
      }
      h1 { font-size: 13px; font-weight: 600; margin: 0 0 4px; }
      h2 { font-size: 11px; font-weight: 600; margin: 16px 0 8px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--figma-color-text-secondary, #5f5f5a); }
      p { margin: 0 0 8px; color: var(--figma-color-text-secondary, #5f5f5a); }
      label { display: block; margin: 0 0 8px; }
      label > span { display: block; margin: 0 0 2px; color: var(--figma-color-text-secondary, #5f5f5a); }
      label.check { display: flex; gap: 6px; align-items: center; }
      input[type='text'], input[type='password'], textarea {
        width: 100%; font: inherit; padding: 6px 8px; border-radius: 4px;
        border: 1px solid var(--figma-color-border, #e6e6e6);
        background: var(--figma-color-bg, #fff); color: inherit;
      }
      textarea { resize: vertical; min-height: 56px; }
      input:focus, textarea:focus { outline: 2px solid var(--figma-color-border-selected, #0d99ff); outline-offset: -1px; }
      .row { display: flex; gap: 8px; }
      .row > label { flex: 1; }
      .hint { font-size: 11px; color: var(--figma-color-text-tertiary, #8c8c88); }
      .hint a { color: inherit; }
      .actions { display: flex; gap: 8px; margin-top: 16px; }
      button {
        font: inherit; font-weight: 500; padding: 8px 12px; border-radius: 6px; cursor: pointer;
        border: 1px solid transparent; background: var(--figma-color-bg-brand, #0d99ff); color: var(--figma-color-text-onbrand, #fff);
      }
      button.secondary { background: transparent; color: inherit; border-color: var(--figma-color-border, #e6e6e6); }
      button[disabled] { opacity: 0.4; cursor: default; }
      #status { margin-top: 12px; white-space: pre-wrap; }
      #status.error { color: var(--figma-color-text-danger, #c10007); }
      #status.success { color: var(--figma-color-text-success, #14ae5c); }
      #status a { color: var(--figma-color-text-brand, #0d99ff); }
    </style>
  </head>
  <body>
    <h1>Ingrid token export</h1>
    <p id="summary">Reading variables…</p>

    <h2>Repository</h2>
    <label><span>Repository (owner/name)</span><input id="repo" type="text" placeholder="Gabigabor/InGrid" /></label>
    <div class="row">
      <label><span>Base branch</span><input id="base" type="text" placeholder="main" /></label>
      <label><span>New branch</span><input id="branch" type="text" /></label>
    </div>
    <label><span>Token file in the repo</span><input id="tokensPath" type="text" /></label>
    <label><span>Build output folder (dist), committed with the JSON</span><input id="distDir" type="text" /></label>
    <label>
      <span>GitHub token</span>
      <input id="token" type="password" placeholder="github_pat_…" autocomplete="off" />
      <span class="hint">Fine-grained token with access to this repository only, and the permissions <b>Contents: Read and write</b> and <b>Pull requests: Read and write</b>.
        <a href="https://github.com/settings/personal-access-tokens/new" target="_blank">Create one</a>.</span>
    </label>
    <label class="check"><input id="remember" type="checkbox" /> Remember the token on this computer</label>

    <h2>Pull request</h2>
    <label><span>Title</span><input id="title" type="text" /></label>
    <label><span>Commit message</span><input id="message" type="text" /></label>
    <label><span>Description (optional; a summary of the export is added below it)</span><textarea id="body"></textarea></label>

    <div class="actions">
      <button id="create" disabled>Create pull request</button>
      <button id="download" class="secondary" disabled>Download JSON</button>
    </div>
    <div id="status"></div>

    <script>
      // ---- BEGIN build-core (generated by tools/figma-token-export/build.mjs from packages/tokens/scripts/build-core.mjs; do not edit) ----
      // Pure token builder: turns the Figma export (ingrid.tokens.json) into the dist/ files.
      //
      // No Node APIs and no dependencies, so the same code runs in `npm run tokens`
      // (scripts/build.mjs) and inside the Figma export plugin, which commits dist/ together
      // with the JSON. tools/figma-token-export/build.mjs inlines this file into the plugin.

      const HEADER = '/* Generated from Figma by packages/tokens/scripts/build.mjs. Do not edit by hand. */\n';

      /**
       * @param {object} doc parsed ingrid.tokens.json
       * @returns {{ files: Record<string, string>, tokenCount: number, textStyleCount: number }}
       *   files is keyed by file name inside dist/. Throws if the export has problems.
       */
      function buildTokenFiles(doc) {
        const meta = doc.$extensions?.['com.figma'];
        if (!meta) throw new Error('ingrid.tokens.json has no $extensions["com.figma"] block; export it with tools/figma-token-export.');
        const errors = [];
        const fail = () => {
          if (!errors.length) return;
          const err = new Error(`Token build failed with ${errors.length} problem(s):\n` + errors.map((e) => `  - ${e}`).join('\n'));
          err.problems = errors.slice();
          throw err;
        };

        // ---- collect tokens ---------------------------------------------------------------------
        const tokens = new Map(); // dotted path -> token
        const walk = (node, trail) => {
          for (const [key, value] of Object.entries(node)) {
            if (key.startsWith('$') || !value || typeof value !== 'object') continue;
            const here = [...trail, key];
            if ('$value' in value) tokens.set(here.join('.'), { path: here, ...value });
            else walk(value, here);
          }
        };
        walk(doc, []);

        const cssName = new Map(); // dotted path -> --ingrid-…
        const seen = new Map();
        for (const [p, t] of tokens) {
          const web = t.$extensions?.['com.figma']?.codeSyntax?.WEB;
          const m = typeof web === 'string' && web.match(/^var\((--[a-z0-9-]+)\)$/);
          if (!m) { errors.push(`${p}: missing or invalid WEB code syntax (${web})`); continue; }
          if (seen.has(m[1])) errors.push(`${p}: CSS name ${m[1]} is also used by ${seen.get(m[1])}`);
          seen.set(m[1], p);
          cssName.set(p, m[1]);
        }

        const refPath = (ref) => {
          const m = typeof ref === 'string' && ref.match(/^\{(.+)\}$/);
          return m ? m[1] : null;
        };
        const varOf = (ref, where) => {
          const p = refPath(ref);
          if (!p || !cssName.has(p)) { errors.push(`${where}: broken reference ${ref}`); return 'unset'; }
          return `var(${cssName.get(p)})`;
        };

        // ---- value formatting ---------------------------------------------------------------------
        // Primitives carry the units; everything above them is var() references, so units flow through.
        const unitFor = (t) => {
          if (t.path.includes('opacity')) return 'ratio';      // Figma 0–100  ->  CSS 0–1
          if (t.path.includes('font-weight')) return 'none';
          return 'px';
        };
        const literal = (t, value) => {
          switch (t.$type) {
            case 'color': return String(value);
            case 'number': {
              const unit = unitFor(t);
              if (unit === 'ratio') return String(Math.round((value / 100) * 10000) / 10000);
              if (unit === 'none') return String(value);
              return value === 0 ? '0' : `${value}px`;
            }
            case 'string': return t.path.includes('font-family') ? `"${value}", sans-serif` : JSON.stringify(value);
            case 'boolean': return value ? '1' : '0';
            default: errors.push(`${t.path.join('.')}: unsupported type ${t.$type}`); return 'unset';
          }
        };
        const format = (t, value, where) => {
          if (typeof value === 'string' && refPath(value)) return varOf(value, where);
          if (value && typeof value === 'object' && 'color' in value && 'opacity' in value) {
            // Colour + opacity value from Figma: keep both references.
            return `color-mix(in srgb, ${varOf(value.color, where)} calc(${varOf(value.opacity, where)} * 100%), transparent)`;
          }
          return literal(t, value);
        };

        // ---- group declarations by collection and mode -------------------------------------------
        const collections = meta.collections; // [{ key, name, modes, defaultMode }]
        const byKey = new Map(collections.map((c) => [c.key, c]));
        const blocks = { primitives: [], base: [], modes: new Map() }; // modes: modeName -> lines

        for (const [p, t] of tokens) {
          const name = cssName.get(p);
          if (!name) continue;
          const col = byKey.get(t.path[0]);
          if (!col) { errors.push(`${p}: unknown collection ${t.path[0]}`); continue; }
          const modes = t.$extensions['com.figma'].modes;
          const isPrimitive = !Object.values(modes).some((v) => (typeof v === 'string' && refPath(v)) || (v && typeof v === 'object'));
          const line = (value) => `  ${name}: ${format(t, value, p)};`;
          const target = isPrimitive && col.modes.length === 1 ? blocks.primitives : blocks.base;
          target.push(line(modes[col.defaultMode]));
          for (const mode of col.modes) {
            if (mode === col.defaultMode) continue;
            if (!blocks.modes.has(mode)) blocks.modes.set(mode, []);
            blocks.modes.get(mode).push(line(modes[mode]));
          }
        }

        fail();

        // ---- tokens.css -------------------------------------------------------------------------
        const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-');
        const defaultModes = [...new Set(collections.filter((c) => c.modes.length > 1).map((c) => slug(c.defaultMode)))];
        let css = HEADER;
        css += '\n/* Primitives: raw values. Use the semantic tokens below in components. */\n';
        css += `:root {\n${blocks.primitives.join('\n')}\n}\n`;
        css += `\n/* Semantic and category tokens. Default mode (${defaultModes.join(', ')}).\n`;
        css += '   Declared on every [data-theme] element as well, so aliases re-resolve inside a themed subtree. */\n';
        css += `:root,\n[data-theme] {\n${blocks.base.join('\n')}\n}\n`;
        for (const [mode, lines] of blocks.modes) {
          const m = slug(mode);
          css += `\n/* ${mode} mode: set data-theme="${m}" on <html> or on any element. */\n`;
          css += `[data-theme="${m}"] {\n${lines.join('\n')}\n}\n`;
          if (m === 'dark') {
            css += `\n/* Follow the operating system when no theme is set. */\n`;
            css += `@media (prefers-color-scheme: dark) {\n  :root:not([data-theme]) {\n${lines.map((l) => '  ' + l).join('\n')}\n  }\n}\n`;
          }
        }

        // ---- text-styles.css --------------------------------------------------------------------
        let textCss = HEADER + '\n/* One class per Figma text style. All values come from the Typography collection. */\n';
        const props = { fontFamily: 'font-family', fontSize: 'font-size', lineHeight: 'line-height', fontWeight: 'font-weight', letterSpacing: 'letter-spacing' };
        for (const s of meta.textStyles) {
          const cls = `.ingrid-text-${slug(s.name)}`;
          const decls = Object.entries(props).filter(([k]) => s[k]).map(([k, prop]) => `  ${prop}: ${varOf(s[k], s.name)};`);
          textCss += `\n/* ${s.name}${s.description ? ': ' + s.description : ''} */\n${cls} {\n${decls.join('\n')}\n}\n`;
        }
        fail();

        // ---- tokens.js / tokens.d.ts ------------------------------------------------------------
        const entries = [...cssName.entries()].map(([p, n]) => [p, `var(${n})`]);
        const js = `// Generated from Figma by packages/tokens/scripts/build.mjs. Do not edit by hand.\n` +
          `/** Every Ingrid token, keyed by its Figma path (collection.group.name), as a CSS var() reference. */\n` +
          `export const tokens = Object.freeze({\n${entries.map(([p, v]) => `  ${JSON.stringify(p)}: ${JSON.stringify(v)},`).join('\n')}\n});\n` +
          `\n/** Text style class names, keyed by Figma text style name. */\n` +
          `export const textStyles = Object.freeze({\n${meta.textStyles.map((s) => `  ${JSON.stringify(s.name)}: ${JSON.stringify('ingrid-text-' + slug(s.name))},`).join('\n')}\n});\n`;
        const dts = `// Generated from Figma by packages/tokens/scripts/build.mjs. Do not edit by hand.\n` +
          `export type TokenPath =\n${entries.map(([p]) => `  | ${JSON.stringify(p)}`).join('\n')};\n` +
          `export declare const tokens: Readonly<Record<TokenPath, string>>;\n` +
          `export type TextStyleName =\n${meta.textStyles.map((s) => `  | ${JSON.stringify(s.name)}`).join('\n')};\n` +
          `export declare const textStyles: Readonly<Record<TextStyleName, string>>;\n`;


        return {
          files: { 'tokens.css': css, 'text-styles.css': textCss, 'tokens.js': js, 'tokens.d.ts': dts },
          tokenCount: cssName.size,
          textStyleCount: meta.textStyles.length,
        };
      }
      // ---- END build-core ----

      const DEFAULTS = {
        repo: 'Gabigabor/InGrid',
        base: 'main',
        tokensPath: 'packages/tokens/src/ingrid.tokens.json',
        distDir: 'packages/tokens/dist',
      };
      const SAVED_FIELDS = ['repo', 'base', 'tokensPath', 'distDir'];
      const $ = (id) => document.getElementById(id);
      const post = (msg) => parent.postMessage({ pluginMessage: msg }, '*');

      let localTokens = null; // export of the open Figma file (only its local collections)
      let fileName = 'Figma';

      const stamp = () => {
        const d = new Date();
        const p = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
      };

      const setStatus = (html, kind = '') => {
        $('status').className = kind;
        $('status').innerHTML = html;
      };
      const escapeHtml = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

      // ---- merge -------------------------------------------------------------------------------
      // One Figma file holds only some collections (Inputs lives in Components, the rest in
      // Foundation). Replace the collections this file has; keep the others from the repo.
      // Text styles are replaced only when this file has text styles.
      function mergeTokens(base, local) {
        const lm = local.$extensions['com.figma'];
        const localKeys = new Set(lm.collections.map((c) => c.key));
        const summary = { updated: lm.collections.map((c) => c.name), kept: [], textStyles: lm.textStyles.length ? 'updated' : 'none' };
        if (!base) return { doc: local, summary };

        const bm = (base.$extensions && base.$extensions['com.figma']) || { collections: [], textStyles: [] };
        const collections = bm.collections.map((c) => (localKeys.has(c.key) ? lm.collections.find((l) => l.key === c.key) : c));
        for (const c of lm.collections) if (!bm.collections.some((b) => b.key === c.key)) collections.push(c);
        summary.kept = bm.collections.filter((c) => !localKeys.has(c.key)).map((c) => c.name);
        if (!lm.textStyles.length && bm.textStyles.length) summary.textStyles = 'kept';

        const doc = {
          $extensions: {
            ...base.$extensions,
            'com.figma': {
              ...bm,
              source: bm.source !== undefined ? bm.source : lm.source,
              collections,
              textStyles: lm.textStyles.length ? lm.textStyles : bm.textStyles,
            },
          },
        };
        for (const c of collections) {
          const from = localKeys.has(c.key) ? local : base;
          if (from[c.key]) doc[c.key] = from[c.key];
        }
        return { doc, summary };
      }

      // ---- GitHub ------------------------------------------------------------------------------
      const encodePath = (p) => p.split('/').map(encodeURIComponent).join('/');

      async function gh(token, path, { method = 'GET', body, raw = false, allow404 = false } = {}) {
        const res = await fetch('https://api.github.com' + path, {
          method,
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
            ...(body ? { 'Content-Type': 'application/json' } : {}),
          },
          body: body ? JSON.stringify(body) : undefined,
        });
        if (res.status === 404 && allow404) return null;
        if (!res.ok) {
          let detail = '';
          try {
            const j = await res.json();
            detail = j.message + (j.errors ? ': ' + j.errors.map((e) => e.message || e.code).join('; ') : '');
          } catch (_) {}
          const hints = {
            401: 'The token is invalid or expired.',
            403: 'The token doesn’t have permission for this. Check its Contents and Pull requests permissions.',
            404: 'Not found. Check the repository name, the branch, and that the token can access this repository.',
          };
          const err = new Error(`GitHub ${method} ${path} failed (${res.status}). ${hints[res.status] || ''} ${detail}`.trim());
          err.status = res.status;
          throw err;
        }
        if (res.status === 204) return null;
        return raw ? res.text() : res.json();
      }

      // Creates the branch with one commit (JSON + rebuilt dist/) and opens the pull request.
      async function createPullRequest(f, onStep) {
        const repo = f.repo.replace(/^https?:\/\/github\.com\//, '').replace(/\.git$/, '').replace(/\/+$/, '');
        if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) throw new Error('Repository must look like owner/name.');
        const R = `/repos/${repo}`;

        onStep('Checking the repository…');
        const info = await gh(f.token, R);
        if (info.permissions && !info.permissions.push) throw new Error(`The token can read ${repo} but can’t push to it.`);
        const base = f.base || info.default_branch;
        const baseRef = await gh(f.token, `${R}/git/ref/heads/${encodePath(base)}`, { allow404: true });
        if (!baseRef) throw new Error(`Base branch “${base}” doesn’t exist.`);
        if (await gh(f.token, `${R}/git/ref/heads/${encodePath(f.branch)}`, { allow404: true })) {
          throw new Error(`Branch “${f.branch}” already exists. Choose another name.`);
        }
        const baseCommit = await gh(f.token, `${R}/git/commits/${baseRef.object.sha}`);

        onStep('Reading the current token file…');
        const currentText = await gh(f.token, `${R}/contents/${encodePath(f.tokensPath)}?ref=${encodeURIComponent(base)}`, { raw: true, allow404: true });
        let current = null;
        if (currentText) {
          try { current = JSON.parse(currentText); } catch (_) { throw new Error(`${f.tokensPath} on ${base} isn’t valid JSON.`); }
        }

        onStep('Merging and building tokens…');
        const { doc, summary } = mergeTokens(current, localTokens);
        const json = JSON.stringify(doc, null, 2) + '\n';
        const built = buildTokenFiles(doc); // throws with the same messages as npm run tokens
        const dist = f.distDir.replace(/\/+$/, '');
        const tree = [
          { path: f.tokensPath, mode: '100644', type: 'blob', content: json },
          ...Object.entries(built.files).map(([name, content]) => ({ path: `${dist}/${name}`, mode: '100644', type: 'blob', content })),
        ];

        onStep('Creating the commit…');
        const newTree = await gh(f.token, `${R}/git/trees`, { method: 'POST', body: { base_tree: baseCommit.tree.sha, tree } });
        if (newTree.sha === baseCommit.tree.sha) return { unchanged: true, base };
        const commit = await gh(f.token, `${R}/git/commits`, {
          method: 'POST',
          body: { message: f.message, tree: newTree.sha, parents: [baseRef.object.sha] },
        });
        await gh(f.token, `${R}/git/refs`, { method: 'POST', body: { ref: `refs/heads/${f.branch}`, sha: commit.sha } });

        onStep('Opening the pull request…');
        const lines = [
          f.body.trim(),
          f.body.trim() ? '' : null,
          `Exported from the Figma file **${fileName}** with the Ingrid token export plugin.`,
          '',
          `- Updated collections: ${summary.updated.join(', ') || 'none'}`,
          `- Kept from ${base}: ${summary.kept.join(', ') || 'none'}`,
          `- Text styles: ${summary.textStyles === 'updated' ? 'updated' : summary.textStyles === 'kept' ? `kept from ${base}` : 'none'}`,
          `- ${built.tokenCount} tokens and ${built.textStyleCount} text styles; \`${dist}/\` rebuilt with build-core.mjs`,
        ].filter((l) => l !== null);
        const pr = await gh(f.token, `${R}/pulls`, {
          method: 'POST',
          body: { title: f.title, head: f.branch, base, body: lines.join('\n') },
        });
        return { url: pr.html_url, number: pr.number };
      }

      // ---- UI wiring ---------------------------------------------------------------------------
      const fields = () => ({
        repo: $('repo').value.trim(),
        base: $('base').value.trim(),
        branch: $('branch').value.trim(),
        tokensPath: $('tokensPath').value.trim().replace(/^\/+/, ''),
        distDir: $('distDir').value.trim().replace(/^\/+/, ''),
        token: $('token').value.trim(),
        title: $('title').value.trim(),
        message: $('message').value.trim(),
        body: $('body').value,
      });

      onmessage = (event) => {
        const msg = event.data.pluginMessage;
        if (!msg) return;
        if (msg.type === 'settings') {
          fileName = msg.fileName || fileName;
          for (const k of SAVED_FIELDS) $(k).value = msg.settings[k] || DEFAULTS[k];
          $('token').value = msg.token || '';
          $('remember').checked = !!msg.token;
          $('branch').value = `tokens/figma-export-${stamp()}`;
          $('title').value = `Update tokens from Figma (${fileName})`;
          $('message').value = `Update tokens from Figma (${fileName})`;
        } else if (msg.type === 'ready') {
          localTokens = msg.tokens;
          const meta = msg.tokens.$extensions['com.figma'];
          $('summary').textContent =
            `${msg.count} variables in ${meta.collections.map((c) => c.name).join(', ')}` +
            (meta.textStyles.length ? `, and ${meta.textStyles.length} text styles` : '') +
            '. Collections that aren’t in this file are kept as they are in the repo.';
          $('create').disabled = false;
          $('download').disabled = false;
        } else if (msg.type === 'error') {
          $('summary').textContent = 'Export failed.';
          setStatus(escapeHtml(msg.message), 'error');
        }
      };

      $('create').onclick = async () => {
        const f = fields();
        const missing = ['repo', 'branch', 'tokensPath', 'distDir', 'token', 'title', 'message'].filter((k) => !f[k]);
        if (missing.length) return setStatus(`Fill in: ${missing.join(', ')}.`, 'error');

        const settings = {};
        for (const k of SAVED_FIELDS) settings[k] = f[k];
        post({ type: 'save-settings', settings, token: $('remember').checked ? f.token : null });

        $('create').disabled = true;
        try {
          const result = await createPullRequest(f, (step) => setStatus(escapeHtml(step)));
          if (result.unchanged) {
            setStatus(`Nothing to commit: ${escapeHtml(result.base)} already matches this Figma file.`, 'success');
          } else {
            setStatus(`Pull request #${result.number} created: <a href="${escapeHtml(result.url)}" target="_blank">${escapeHtml(result.url)}</a>`, 'success');
            post({ type: 'notify', message: `Pull request #${result.number} created` });
            $('branch').value = `tokens/figma-export-${stamp()}`; // ready for another run
          }
        } catch (err) {
          setStatus(escapeHtml(err.message), 'error');
          post({ type: 'notify', message: 'Token export failed', error: true });
        } finally {
          $('create').disabled = false;
        }
      };

      // Downloads this file's export only (no merge, no GitHub).
      $('download').onclick = () => {
        const json = JSON.stringify(localTokens, null, 2) + '\n';
        const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ingrid.tokens.json';
        a.click();
        URL.revokeObjectURL(url);
      };
    </script>
  </body>
</html>
